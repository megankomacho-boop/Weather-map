
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界の天気・標高・海底水深</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
body {
    margin: 0;
    font-family: sans-serif;
}
#info {
    padding: 12px;
    font-size: 16px;
}
#result {
    margin-top: 8px;
    line-height: 1.6;
}
#map {
    width: 100%;
    height: 80vh;
}
</style>
</head>

<body>

<div id="info">
<b>世界地図をクリックすると、明日の天気・標高・海底水深を表示します</b>
<div id="result">地点を選択してください</div>
</div>

<div id="map"></div>

<!-- LeafletのJavaScriptライブラリを読み込む -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// =====================================
// ① 世界地図（Esri）
// =====================================

// 地図の初期位置と拡大率を設定
const map = L.map('map').setView([20, 0], 2);

// Esriの地図サーバから世界地図の画像データを取得する
// 取得データ：世界各国の地図画像
L.tileLayer(
 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
 {
  attribution: 'Tiles &copy; Esri',
  maxZoom: 19
 }
).addTo(map);

let marker = null;
let requestId = 0;

// =====================================
// ② 天気コードを日本語に変換
// =====================================
function weatherName(code) {
    if (code === 0) return '快晴';
    if (code === 1) return '晴れ';
    if (code === 2) return '一部曇り';
    if (code === 3) return '曇り';
    if ([45,48].includes(code)) return '霧';
    if ([51,53,55,56,57].includes(code)) return '霧雨';
    if ([61,63,65,66,67].includes(code)) return '雨';
    if ([71,73,75,77].includes(code)) return '雪';
    if ([80,81,82].includes(code)) return 'にわか雨';
    if ([85,86].includes(code)) return 'にわか雪';
    if ([95,96,99].includes(code)) return '雷雨';
    return '不明';
}

// =====================================
// ③ 明日の天気を取得
// =====================================
async function getWeather(lat, lon) {

    // Open-MeteoのWeb APIから明日の天気予報を取得する
    // 取得データ：天気コード、最高気温、最低気温、最大降水確率
    // JSON形式でデータが返される
    const url =
      'https://api.open-meteo.com/v1/forecast'
      + '?latitude=' + lat
      + '&longitude=' + lon
      + '&daily=weather_code,temperature_2m_max,'
      + 'temperature_2m_min,precipitation_probability_max'
      + '&timezone=auto'
      + '&forecast_days=2';

    //const response = await fetch(url);
// Open-Meteoから天気予報を取得
// ブラウザのキャッシュを使わず、最新データを要求する
const response = await fetch(url, {
    mode: 'cors',
    cache: 'no-store'
});


    if (!response.ok) {
        throw new Error('HTTP ' + response.status);
    }

    const data = await response.json();

    if (!data.daily || data.daily.time.length < 2) {
        throw new Error('予報データがありません');
    }

    // 配列の0番目は今日、1番目は明日
    return {
        date: data.daily.time[1],
        weather: weatherName(data.daily.weather_code[1]),
        max: data.daily.temperature_2m_max[1],
        min: data.daily.temperature_2m_min[1],
        rain: data.daily.precipitation_probability_max[1]
    };
}

// =====================================
// ④ GEBCOから標高・水深を取得
// =====================================
async function getGEBCO(lat, lon) {

    const delta = 0.01;

    // GEBCOの地形データを問い合わせる条件を設定
    const params = new URLSearchParams({
        SERVICE: 'WMS',
        VERSION: '1.3.0',
        REQUEST: 'GetFeatureInfo',
        LAYERS: 'GEBCO_LATEST_2_sub_ice_topo',
        QUERY_LAYERS: 'GEBCO_LATEST_2_sub_ice_topo',
        CRS: 'EPSG:4326',
        BBOX: [
            lat-delta, lon-delta,
            lat+delta, lon+delta
        ].join(','),
        WIDTH: '101',
        HEIGHT: '101',
        I: '50',
        J: '50',
        INFO_FORMAT: 'text/plain'
    });

    // GEBCOのWebサービスから標高・海底水深を取得する
    // 取得データ：海面を基準とした高さ（m）
    // プラスの値は標高、マイナスの値は海底の深さを表す
    // テキスト形式でデータが返される
    const url =
      'https://wms.gebco.net/mapserv?'
      + params.toString();

    let response;

    try {
        response = await fetch(url);
    } catch (error) {
        throw new Error(
          'GEBCOへのブラウザ通信に失敗（CORS等の可能性）'
        );
    }

    if (!response.ok) {
        throw new Error('GEBCO HTTP ' + response.status);
    }

    const text = await response.text();

    // 応答データのvalue_listから数値を取り出す
    const match = text.match(
      /value_list\s*=\s*['"]?\s*(-?\d+(?:\.\d+)?)/i
    );

    if (!match) {
        throw new Error('GEBCOの数値を読み取れません');
    }

    return Number(match[1]);
}

// =====================================
// ⑤ 標高・水深の表示
// =====================================
function heightName(value) {

    if (value < 0) {
        return '海底の水深：約'
          + Math.abs(value).toLocaleString() + ' m';
    }

    return '標高：約'
      + value.toLocaleString() + ' m';
}

// =====================================
// ⑥ 地図クリック時の処理
// =====================================
map.on('click', async function(e) {

    // クリックした地点の緯度・経度を取得
    const lat = e.latlng.lat;
    const lon = e.latlng.lng;
    const currentId = ++requestId;

    if (marker) {
        map.removeLayer(marker);
    }

    marker = L.marker([lat, lon]).addTo(map);
    const currentMarker = marker;

    const resultBox = document.getElementById('result');

    resultBox.textContent =
        '明日の天気・標高・水深を取得中...';

    // 2つのWeb APIからデータを取得する
    const [weatherResult, heightResult] =
      await Promise.allSettled([
          getWeather(lat, lon),
          getGEBCO(lat, lon)
      ]);

    if (currentId !== requestId) return;

    let result =
        '緯度: ' + lat.toFixed(6)
        + '　経度: ' + lon.toFixed(6);

    // 天気予報を表示
    if (weatherResult.status === 'fulfilled') {

        const w = weatherResult.value;

        result +=
          '　現地日付: ' + w.date
          + '　天気: ' + w.weather
          + '　最高気温: ' + w.max + ' ℃'
          + '　最低気温: ' + w.min + ' ℃'
          + '　最大降水確率: '
          + (w.rain == null ? '不明' : w.rain + ' %');

    } else {

        result += '　天気取得エラー: '
          + weatherResult.reason.message;
    }

    // 標高・海底水深を表示
    if (heightResult.status === 'fulfilled') {

        result += '　'
          + heightName(heightResult.value);

    } else {

        result += '　標高・水深取得エラー: '
          + heightResult.reason.message;
    }

    resultBox.textContent = result;
    currentMarker.bindPopup(result).openPopup();
});
</script>
</body>
</html>
